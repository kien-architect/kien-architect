<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="90" style="background: transparent;">
  <defs>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>
    <style>
      .bg-line {
        stroke: #22272e;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .glow-blur-line {
        stroke: #ff9900;
        stroke-width: 8;
        stroke-linecap: round;
        opacity: 0.6;
        filter: url(#glow-blur);
        animation: flow 4s linear infinite;
      }
      .glow-core-line {
        stroke: #ffb03a;
        stroke-width: 3;
        stroke-linecap: round;
        animation: flow 4s linear infinite;
      }
      @keyframes flow {
        0% {
          stroke-dashoffset: 720;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      .node {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 2;
        rx: 16px;
        ry: 16px;
        transition: all 0.3s ease;
      }
      .node-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #8b949e;
        text-anchor: middle;
        pointer-events: none;
      }
      @keyframes pulse {
        0% {
          fill: #0d1117;
          stroke: #30363d;
          filter: none;
        }
        8% {
          fill: #161b22;
          stroke: #ff9900;
          filter: drop-shadow(0px 0px 5px rgba(255, 153, 0, 0.7));
        }
        18% {
          fill: #0d1117;
          stroke: #30363d;
          filter: none;
        }
        100% {
          fill: #0d1117;
          stroke: #30363d;
          filter: none;
        }
      }
      .n1 { animation: pulse 4s infinite; animation-delay: 0s; }
      .n2 { animation: pulse 4s infinite; animation-delay: 0.67s; }
      .n3 { animation: pulse 4s infinite; animation-delay: 1.33s; }
      .n4 { animation: pulse 4s infinite; animation-delay: 2.00s; }
      .n5 { animation: pulse 4s infinite; animation-delay: 2.67s; }
      .n6 { animation: pulse 4s infinite; animation-delay: 3.33s; }
      .n7 { animation: pulse 4s infinite; animation-delay: 4.00s; }
      
      .t1 { animation: textPulse 4s infinite; animation-delay: 0s; }
      .t2 { animation: textPulse 4s infinite; animation-delay: 0.67s; }
      .t3 { animation: textPulse 4s infinite; animation-delay: 1.33s; }
      .t4 { animation: textPulse 4s infinite; animation-delay: 2.00s; }
      .t5 { animation: textPulse 4s infinite; animation-delay: 2.67s; }
      .t6 { animation: textPulse 4s infinite; animation-delay: 3.33s; }
      .t7 { animation: textPulse 4s infinite; animation-delay: 4.00s; }

      @keyframes textPulse {
        0% {
          fill: #8b949e;
        }
        8% {
          fill: #ffffff;
        }
        18% {
          fill: #8b949e;
        }
        100% {
          fill: #8b949e;
        }
      }
    </style>
  </defs>

  <!-- Connection Lines -->
  <path d="M 60 45 L 780 45" class="bg-line" />
  <path d="M 60 45 L 780 45" stroke-dasharray="100 620" class="glow-blur-line" />
  <path d="M 60 45 L 780 45" stroke-dasharray="100 620" class="glow-core-line" />

  <!-- Nodes and Text -->
  <!-- Node 1: Design -->
  <g style="cursor: pointer;">
    <rect x="15" y="25" width="90" height="40" class="node n1" />
    <text x="60" y="49" class="node-text t1">Design</text>
  </g>

  <!-- Node 2: Build -->
  <g style="cursor: pointer;">
    <rect x="135" y="25" width="90" height="40" class="node n2" />
    <text x="180" y="49" class="node-text t2">Build</text>
  </g>

  <!-- Node 3: Secure -->
  <g style="cursor: pointer;">
    <rect x="255" y="25" width="90" height="40" class="node n3" />
    <text x="300" y="49" class="node-text t3">Secure</text>
  </g>

  <!-- Node 4: Deploy -->
  <g style="cursor: pointer;">
    <rect x="375" y="25" width="90" height="40" class="node n4" />
    <text x="420" y="49" class="node-text t4">Deploy</text>
  </g>

  <!-- Node 5: Monitor -->
  <g style="cursor: pointer;">
    <rect x="495" y="25" width="90" height="40" class="node n5" />
    <text x="540" y="49" class="node-text t5">Monitor</text>
  </g>

  <!-- Node 6: Optimize -->
  <g style="cursor: pointer;">
    <rect x="615" y="25" width="90" height="40" class="node n6" />
    <text x="660" y="49" class="node-text t6">Optimize</text>
  </g>

  <!-- Node 7: Repeat -->
  <g style="cursor: pointer;">
    <rect x="735" y="25" width="90" height="40" class="node n7" />
    <text x="780" y="49" class="node-text t7">Repeat</text>
  </g>
</svg>
