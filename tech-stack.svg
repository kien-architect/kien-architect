<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 235" width="100%" height="235" style="background: transparent;">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    
    <!-- Clip path to hide the scrolling digits except for the active one -->
    <clipPath id="number-clip">
      <rect x="180" y="60" width="60" height="18" />
    </clipPath>

    <style>
      .card {
        fill: #0d1117;
        stroke: #21262d;
        stroke-width: 1.5;
        rx: 10px;
        ry: 10px;
        filter: url(#card-shadow);
        transition: all 0.3s ease;
      }
      .card-group:hover .card {
        stroke: #58a6ff;
        fill: #161b22;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #f0f6fc;
      }
      .tech-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #8b949e;
      }
      .level-text {
        font-family: "Fira Code", monospace, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #58a6ff;
        text-anchor: end;
      }
      .progress-bg {
        fill: #21262d;
        rx: 3px;
      }
      
      /* Progress fill animations */
      .bar-fill {
        rx: 3px;
        animation-duration: 6s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(0.1, 0.8, 0.2, 1);
      }
      
      @keyframes fillCloud {
        0%, 10% { width: 0px; }
        40%, 80% { width: 135px; }
        90%, 100% { width: 0px; }
      }
      @keyframes fillIaC {
        0%, 10% { width: 0px; }
        40%, 80% { width: 120px; }
        90%, 100% { width: 0px; }
      }
      @keyframes fillContainers {
        0%, 10% { width: 0px; }
        40%, 80% { width: 128px; }
        90%, 100% { width: 0px; }
      }
      @keyframes fillCICD {
        0%, 10% { width: 0px; }
        40%, 80% { width: 128px; }
        90%, 100% { width: 0px; }
      }
      @keyframes fillSecurity {
        0%, 10% { width: 0px; }
        40%, 80% { width: 113px; }
        90%, 100% { width: 0px; }
      }
      @keyframes fillObs {
        0%, 10% { width: 0px; }
        40%, 80% { width: 120px; }
        90%, 100% { width: 0px; }
      }

      .fill-cloud { animation-name: fillCloud; }
      .fill-iac { animation-name: fillIaC; }
      .fill-containers { animation-name: fillContainers; }
      .fill-cicd { animation-name: fillCICD; }
      .fill-security { animation-name: fillSecurity; }
      .fill-obs { animation-name: fillObs; }

      /* Odometer text scrolling animation */
      .counter-scroll {
        animation: countUp 6s cubic-bezier(0.1, 0.8, 0.2, 1) infinite;
      }
      
      @keyframes countUp {
        0%, 10% {
          transform: translateY(0px);
        }
        40%, 80% {
          transform: translateY(-135px); /* 9 steps of 15px */
        }
        90%, 100% {
          transform: translateY(0px);
        }
      }

      .glow-dot {
        animation: blink 1.8s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% {
          opacity: 0.4;
          filter: none;
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 4px var(--glow-color));
        }
      }

      /* Category Colors */
      .color-cloud { --glow-color: #ff9900; }
      .color-iac { --glow-color: #844fba; }
      .color-containers { --glow-color: #326ce5; }
      .color-cicd { --glow-color: #2088ff; }
      .color-security { --glow-color: #00ffd0; }
      .color-obs { --glow-color: #f46800; }
    </style>
  </defs>

  <!-- Row 1 -->
  <!-- Card 1: Cloud Architecture -->
  <g class="card-group color-cloud" transform="translate(15, 15)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">Cloud Architecture</text>
    <text x="20" y="48" class="tech-text">AWS (EC2, S3, VPC, Lambda, IAM...)</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-cloud" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">80%</tspan>
        <tspan x="230" dy="15">90%</tspan>
      </text>
    </g>
  </g>

  <!-- Card 2: Infrastructure as Code -->
  <g class="card-group color-iac" transform="translate(280, 15)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">Infrastructure as Code</text>
    <text x="20" y="48" class="tech-text">Terraform, Ansible, Linux Shell</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-iac" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">75%</tspan>
        <tspan x="230" dy="15">80%</tspan>
      </text>
    </g>
  </g>

  <!-- Card 3: Containers & K8s -->
  <g class="card-group color-containers" transform="translate(545, 15)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">Containers &amp; Orchestration</text>
    <text x="20" y="48" class="tech-text">Kubernetes, Docker, Helm</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-containers" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">80%</tspan>
        <tspan x="230" dy="15">85%</tspan>
      </text>
    </g>
  </g>

  <!-- Row 2 -->
  <!-- Card 4: CI/CD & GitOps -->
  <g class="card-group color-cicd" transform="translate(15, 125)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">GitOps &amp; Automation</text>
    <text x="20" y="48" class="tech-text">ArgoCD, GitHub Actions, Jenkins</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-cicd" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">80%</tspan>
        <tspan x="230" dy="15">85%</tspan>
      </text>
    </g>
  </g>

  <!-- Card 5: DevSecOps (Security) -->
  <g class="card-group color-security" transform="translate(280, 125)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">DevSecOps &amp; Security</text>
    <text x="20" y="48" class="tech-text">Trivy, Vault, external-secrets, SAST</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-security" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">65%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">75%</tspan>
      </text>
    </g>
  </g>

  <!-- Card 6: Observability -->
  <g class="card-group color-obs" transform="translate(545, 125)">
    <rect x="0" y="0" width="250" height="95" class="card" />
    <circle cx="20" cy="22" r="4.5" fill="var(--glow-color)" class="glow-dot" />
    <text x="32" y="26" class="title-text">Observability &amp; Operations</text>
    <text x="20" y="48" class="tech-text">Prometheus, Grafana, Alertmanager</text>
    <rect x="20" y="68" width="150" height="6" class="progress-bg" />
    <rect x="20" y="68" width="0" height="6" fill="var(--glow-color)" class="bar-fill fill-obs" />
    
    <!-- Odometer Number -->
    <g clip-path="url(#number-clip)">
      <text class="level-text counter-scroll" x="230" y="73" fill="var(--glow-color)">
        <tspan x="230" dy="0">0%</tspan>
        <tspan x="230" dy="15">10%</tspan>
        <tspan x="230" dy="15">20%</tspan>
        <tspan x="230" dy="15">30%</tspan>
        <tspan x="230" dy="15">40%</tspan>
        <tspan x="230" dy="15">50%</tspan>
        <tspan x="230" dy="15">60%</tspan>
        <tspan x="230" dy="15">70%</tspan>
        <tspan x="230" dy="15">75%</tspan>
        <tspan x="230" dy="15">80%</tspan>
      </text>
    </g>
  </g>
</svg>
